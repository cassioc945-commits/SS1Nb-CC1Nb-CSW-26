<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../../src/style.css">
</head>

<body>

    <header class="container-nav">
        <nav class="navegacao">
            <ul class="menu-lista">

                <li class="menu-item-container">
                    <button class="dropdown-trigger">
                        <img src="../../public/icones-images/menu.png" alt="menu-arca" class="icone-topo">
                    </button>

                    <div class="dropdown-menu">
                        <ul class="dropdown-links">
                            <li><a href="../../index.html">🏠︎ Menu</a></li>
                            <li><a href="../../pages/adocao/index.html">🐾 Adotar</a></li>
                            <li><a href="../../pages/castracao/index.html">🛠️ Castração</a></li>
                            <li><a href="../../pages/denuncia/index.html">🚨 Fazer Denúncia</a></li>
                            <li><a href="../../pages/pedido_resgate/index.html">🚨 Acionar Resgate</a></li>
                            <li><a href="#ajuda">📱 Ouvidoria</a></li>
                        </ul>
                    </div>
                </li>

                <li class="barra-pesquisa">
                    <input class="search" type="search" placeholder="🔎︎ Pesquisar">
                </li>

                <li class="bloco-direita-container">
                    <ul class="menu-lista-02">
                        <li><img src="../../public/icones-images/acessibilidade.png" alt="acessibilidade" class="ajuste-icon">
                        </li>
                        <li class="menu-item-container">
                            <button class="dropdown-trigger">
                                <img src="../../public/icones-images/perfil.png" alt="perfil" class="ajuste-icon">
                            </button>
                            <div class="dropdown-menu">
                                <div id="conteudo-perfil">
                                    <ul class="dropdown-links">
                                        <li><a href="#" id="btn-entrar">🔑 Entrar / Login</a></li>
                                        <li><a href="#">📝 Criar uma Conta</a></li>
                                    </ul>
                                </div>
                            </div>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="rescue-main-container">

        <h1 class="rescue-title">Pedido de Resgate</h1>

        <div class="rescue-form-box">

            <div class="rescue-badge-container">
                <img src="./public/icones-images/escudo-pet.png" alt="Ícone Proteção" class="rescue-logo">
                <h3>Adicionar Informações</h3>
            </div>

            <div class="form-group">
                <label class="rescue-label">Local:</label>
                <input type="text" class="rescue-input" placeholder="Digite o local do resgate">
            </div>

            <div class="form-group">
                <label class="rescue-label">Hora:</label>
                <input type="text" class="rescue-input rescue-input-short" placeholder="00:00">
            </div>

            <div class="form-group">
                <label class="rescue-label">Tipo de Animal:</label>
                <input type="text" class="rescue-input" placeholder="Ex: Cão, Gato, Ave...">
            </div>

            <div class="form-group-block">
                <label class="rescue-label">Descrição do Caso:</label>
                <textarea class="rescue-textarea"
                    placeholder="Descreva os detalhes da situação do animal..."></textarea>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn-enviar">Enviar</button>
            </div>

        </div>

    </main>

    <script src="../../src/script.js"></script>
</body>
</html>
